# Curve scores (computed but not shown on the pages; not used for Best or the grid). From harvestgreen22's FM27
# attribute test (docs/attribute_test_fm27.csv): each attribute's win-rate change, in points, against an all-12 player
# when it's [1, 6, 18]; 12 = 0, straight lines between. Dips are taken as noise and flattened, and Work Rate past 12
# (worth nothing in the test) scores half its 6-12 rate per point. Attributes not listed are worth nothing.
[curve]
Pace = [-40.0, -26.8, 19.4]
Acceleration = [-34.0, -21.4, 14.1]
Stamina = [-29.4, -17.6, 14.0]
"Jumping Reach" = [-18.0, -12.2, 15.4]
Anticipation = [-19.8, -8.8, 4.8]
Strength = [-18.8, -8.8, 4.6]
"Work Rate" = [-22.0, -6.2, 3.1]
Pressure = [-15.6, -2.0, 5.2]
Concentration = [-13.4, -5.6, 4.4]
"Natural Fitness" = [-12.6, -4.0, 2.8]
Balance = [-14.2, -8.2, 0.0]
Dribbling = [-6.8, -3.8, 3.6]
Finishing = [-7.8, -4.8, 2.2]
"Long Shots" = [-9.8, -4.6, 0.0]
"Important Matches" = [-8.8, -5.0, 0.0]
Determination = [-6.0, 0.0, 2.8]
Agility = [-8.4, -3.2, 0.2]
Consistency = [-6.4, -2.0, 1.2]
Heading = [-6.8, -1.6, 0.0]
Crossing = [-4.6, -4.0, 0.6]
Bravery = [-2.4, -2.4, 1.4]
Vision = [-8.2, -8.2, 0.0]
Composure = [-5.0, -2.0, 0.0]
Decisions = [-2.4, -2.4, 1.0]
Flair = [-1.6, -1.6, 1.8]
Marking = [-4.2, -0.6, 0.0]
Aggression = [0.0, 0.0, 1.2]
Positioning = [0.0, 0.0, 2.6]
Tackling = [-1.0, 0.0, 0.0]
Technique = [-1.2, -1.2, 0.0]
"Off The Ball" = [-2.4, -2.4, 0.0]

# Each [curve_scores.<label>] is a score: attribute weights out of 5, where 5 = the test's full value (the default)
# and 0 leaves it out. Score = Σ(curve value × weight/5), shown as the level at which a player with all of those
# attributes equal would be worth the same (so ~12 = the test's all-12 player). Outfield players only.
# Labels start "hg" (harvestgreen) so they don't clash with the position columns.
[curve_scores.hgCB]  # in the air, less running, no attacking
"Jumping Reach" = 8
Stamina = 2
"Work Rate" = 2
Dribbling = 0
Finishing = 0
"Long Shots" = 0
"Off The Ball" = 0

[curve_scores.hg9]  # in the air, less running
"Jumping Reach" = 8
Stamina = 2
"Work Rate" = 2

[curve_scores.hgOther]  # FB, 6, wing, 10: running, less in the air
"Jumping Reach" = 2

# %win (column after the positions; outfield only): harvestgreen22's FM27 test as it stands, no flattening.
# Each attribute's [to_1, to_6, to_18] from Tables 1-3: the change in team win rate, in points, when the whole team
# has it at 1, 6 or 18 instead of 12 (12 = 0, straight lines between: Tables 6-8; past 18 the 12-18 line continues).
# %win = the sum over a player's observed attributes: the win-rate change if the whole team had the player's attributes (÷ 10 for one player).
# Not tested in every range, so not here: Leadership, Teamwork, Penalty Taking, Corners, Free Kicks, Long Throws.
[win]
Pace                = [-40.0, -26.8, 19.4]
